[workspace]
members = ["."]

[package]
name = "rynd"
version = "0.1.0"
edition = "2024"
description = "A small functional language for Rust applications, with a bytecode VM (Meso) and a Rust transpiler."
license = "BSD-3-Clause"
keywords = ["language", "scripting", "embedded", "vm", "transpiler"]
categories = ["development-tools", "parser-implementations"]

[features]
# Opt-in native JIT: compiles statically int/bool-typed Rynd functions to
# machine code with Cranelift (see src/jit.rs). Default builds have zero
# dependencies; this feature pulls in the Cranelift crates below.
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]

[dependencies]

[dev-dependencies]

[lib]
name = "rynd"
path = "src/lib.rs"

[[bin]]
name = "rynd"
path = "src/main.rs"

[[bench]]
name = "rynd_benchmarks"
harness = false

[dependencies.cranelift-codegen]
version = "0.136"
optional = true

[dependencies.cranelift-frontend]
version = "0.136"
optional = true

[dependencies.cranelift-jit]
version = "0.136"
optional = true

[dependencies.cranelift-module]
version = "0.136"
optional = true

[dependencies.cranelift-native]
version = "0.136"
optional = true
